# בדיקת בנייה ל-iOS - מופעלת ידנית בלבד (Actions -> iOS Build Check -> Run workflow),
# לא צריך שום חשבון אפל/מפתחות.
#
# מטרה: לוודא שהאפליקציה בכלל מתקמפלת בהצלחה כאפליקציית iOS - בלי חתימה דיגיטלית
# ובלי העלאה לשום מקום. זו רק בדיקת "זה נבנה בסדר", על מחשב Mac של GitHub (macos-latest).
#
# בעבר רצה אוטומטית על כל push - אבל דקות Mac נספרות פי 10 במכסה החינמית של מאגר פרטי,
# כך שבדיקה על כל שינוי קטן אכלה את המכסה וחסמה גם את בניית ה-TestFlight.
#
# כשזה ירוץ בהצלחה (V ירוק), זה אומר שכל השרשרת - קוד React, Capacitor,
# ופרויקט ה-Xcode - עובדת ביחד. זה לא אומר שהאפליקציה מוכנה להעלאה לחנות,
# בשביל זה יש את ios-release.yml.

name: iOS Build Check

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env for the web build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor (copy web build into the iOS project)
        run: npx cap sync ios

      - name: Build for iOS Simulator (no code signing needed)
        working-directory: ios/App
        run: |
          # בלי -sdk: הוא היה כופה SDK של אייפון גם על אפליקציית השעון המוטמעת.
          # ה-destination לבדו נותן ל-Xcode לבחור watchsimulator לשעון ו-iphonesimulator לאייפון.
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      # בודק שהאפליקציה לא רק מתקמפלת אלא גם באמת עולה במסך - בלי צורך
      # במחשב Mac אישי בכלל. תופס לוגים מלאים + צילום מסך כ-artifact,
      # כדי שאפשר יהיה לאבחן בעיות (כמו מסך שחור) בלי לגעת ב-Xcode בעצמו.
      - name: Boot Simulator and launch the app
        working-directory: ios/App
        run: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Using simulator UDID: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          APP_PATH=$(find build/Build/Products -maxdepth 2 -name "App.app" -print -quit)
          echo "App path: $APP_PATH"

          xcrun simctl install "$UDID" "$APP_PATH"

          # unified log ברקע (זה מה שכן עבד בניסיון קודם ונתן פירוט אמיתי -
          # console.log/print() נבדק בנפרד מול index.html, לא כאן)
          xcrun simctl spawn "$UDID" log stream --level debug --predicate 'process == "App"' > app-simulator.log 2>&1 &
          LOG_PID=$!

          xcrun simctl launch "$UDID" co.brainslead.ballast

          sleep 5
          xcrun simctl io "$UDID" screenshot app-screenshot-early.png
          sleep 20
          xcrun simctl io "$UDID" screenshot app-screenshot-late.png

          kill $LOG_PID 2>/dev/null || true
          sleep 1

          echo "----- Last 300 lines of unified log -----"
          tail -n 300 app-simulator.log || true

      - name: Upload simulator screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-check
          path: |
            ios/App/app-screenshot-early.png
            ios/App/app-screenshot-late.png
            ios/App/app-simulator.log
          if-no-files-found: warn
