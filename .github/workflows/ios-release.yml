# בנייה חתומה + העלאה ל-App Store Connect (TestFlight / חנות האפליקציות).
#
# בניגוד ל-ios-build-check.yml, זה בונה גרסה אמיתית, חותמת אותה עם תעודת
# ההפצה של אפל, ומעלה אותה. בשביל זה צריך שבעה "סודות" (secrets) שעדיין
# לא קיימים - ה-workflow הזה לא ירוץ בהצלחה עד שהם יתווספו.
#
# ==========================================================================
# מה צריך להוסיף לפני שזה יכול לרוץ (GitHub -> Settings -> Secrets and
# variables -> Actions -> New repository secret):
# ==========================================================================
#
#   BUILD_CERTIFICATE_BASE64        תעודת ההפצה (.p12) מקודדת ב-base64
#   P12_PASSWORD                    הסיסמה שנתת לתעודה כשייצאת אותה
#   BUILD_PROVISION_PROFILE_BASE64  קובץ ה-provisioning profile (.mobileprovision)
#                                   מקודד ב-base64
#   KEYCHAIN_PASSWORD               סיסמה חופשית שממציאים - רק לשימוש פנימי
#                                   של ה-keychain הזמני בתוך הריצה
#   APPLE_TEAM_ID                   ה-Team ID מחשבון ה-Apple Developer (10 תווים)
#   APP_STORE_CONNECT_API_KEY_ID    Key ID של מפתח App Store Connect API
#   APP_STORE_CONNECT_ISSUER_ID     Issuer ID של אותו מפתח
#   APP_STORE_CONNECT_API_KEY_BASE64  קובץ המפתח הפרטי (.p8) מקודד ב-base64
#
# את כל אלה מקבלים מפורטל ה-Apple Developer ומ-App Store Connect - זה
# בדיוק השלב שנעשה יחד ברגע שההרשמה ל-Apple Developer Program תאושר.
#
# מריצים את זה ידנית (Actions -> iOS Release -> Run workflow), לא אוטומטית
# על כל push - כדי לא "לבזבז" בנייה על כל שינוי קטן.
# ==========================================================================

name: iOS Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env for the web build
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build the web app
        run: npm run build

      - name: Sync Capacitor (copy web build into the iOS project)
        run: npx cap sync ios

      - name: Import signing certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERT_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive the app
        working-directory: ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Export the .ipa for App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -n 1)

          xcrun altool --upload-app \
            -f "$IPA_PATH" \
            -t ios \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Clean up temporary keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
