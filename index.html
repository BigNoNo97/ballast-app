<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- אבחון זמני: אם קורה JS error/unhandled rejection לפני שהאפליקציה עולה,
         מציג אותו ישירות על המסך (רקע צבעוני + טקסט השגיאה) כדי שאפשר יהיה
         לראות אותו בצילום מסך של הסימולטור, בלי תלות בלכידת לוגים. להסיר
         אחרי שהבעיה עם המסך השחור ב-Capacitor iOS תיפתר. -->
    <script>
      (function () {
        function showError(title, detail) {
          document.documentElement.style.background = '#b00020';
          document.body.style.background = '#b00020';
          document.body.innerHTML =
            '<pre style="color:#fff;font-size:13px;line-height:1.4;white-space:pre-wrap;padding:20px;direction:ltr;text-align:left;font-family:monospace;">' +
            title + '\n\n' + detail +
            '</pre>';
        }
        window.addEventListener('error', function (e) {
          showError('JS ERROR', (e.message || '') + '\nat ' + (e.filename || '') + ':' + e.lineno + ':' + e.colno + '\n\n' + (e.error && e.error.stack ? e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var detail = reason && reason.stack ? reason.stack : String(reason);
          showError('UNHANDLED PROMISE REJECTION', detail);
        });
      })();
    </script>
    
    <!-- iOS Web App & PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ballast" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>Ballast | מעקב אימוני כושר</title>
    <meta name="description" content="אפליקציית מעקב אימוני כושר חכמה לאייפון עם זיכרון משקלים והחלפת תרגילים בלחיצה אחת" />
    
    <!-- Google Fonts for Modern Hebrew & Latin Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&family=Rubik:wght@400;500;600;700;800&family=SF+Pro+Display&display=swap" rel="stylesheet" />
    
    <!-- Favicon / Apple Touch Icon -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body class="dark-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
